# Dock — Black theme (SimpleCommander DARK palette)
# Near-true-black surfaces; accent stays the same blue.

# ── Core surface ramp ────────────────────────────────────────────────
@background          = #0A0B0D
@foreground          = #D4D4D4
@accentColor         = #4DA6FF

Panel.background     = #0F1113
Panel.foreground     = #D4D4D4

# ── Dock custom keys (mirror FlatDarkLaf.properties, darker values) ──
Dock.accent          = #4DA6FF
Dock.accentText      = #0A0B0D
Dock.cardBackground  = #151717
Dock.cardBorder      = #24272C
Dock.tileBackground  = #0F1113
Dock.fieldBackground = #151717

# Footer progress bar
ProgressBar.foreground = #4DA6FF

# ── File-type icon hues (same as dark — they read well on black) ─────
Dock.share            = #89DDF7
Dock.fileImage        = #BB9AF7
Dock.fileVideo        = #FF9E64
Dock.fileAudio        = #7DCFFF
Dock.fileDoc          = #73DACA
Dock.fileCode         = #9ECE6A
Dock.fileArchive      = #E0AF68
Dock.fileBinary       = #F7768E
Dock.fileLog          = #A9B1D6

# Archive row tint
Dock.archiveRowTint   = #E0AF6822

# Speed-search hit marker
Dock.searchHit        = #E0AF6870

# Viewer / player wells — true black
Dock.viewerBackground = #050607
Dock.playerSurface    = #050607

# Code background (one step above pure black)
Dock.mdCodeBackground = #121416

# Code tokens (same as dark — they're already tuned for low-luma surfaces)
Dock.codeKeyword  = #569CD6
Dock.codeType     = #4EC9B0
Dock.codeString   = #CE9178
Dock.codeComment  = #6A9955
Dock.codeNumber   = #B5CEA8
Dock.codeFunction = #DCDCAA
Dock.editChanged  = #3FB950

# ── Component geometry (same as dark) ────────────────────────────────
Component.focusWidth        = 0
Component.innerFocusWidth   = 0
Component.arc               = 8
Button.arc                  = 8
Button.margin               = 4,14,4,14
Button.iconTextGap          = 6

# Ghost toolbar buttons — white overlays at low alpha on black
Button.toolbar.hoverBackground   = #FFFFFF14
Button.toolbar.pressedBackground = #FFFFFF22

# ── Layout metrics ───────────────────────────────────────────────────
TitlePane.height            = 40
TitlePane.background        = #0A0B0D
TabbedPane.tabHeight        = 34
Table.rowHeight             = 30
Table.alternateRowColor     = #0C0E10
Table.cellMargins           = 2,10,2,10
Table.intercellSpacing      = 0,0
Table.gridColor             = #1A1D20
Table.selectionBackground   = #11253C
Table.selectionForeground   = #D4D4D4
ScrollBar.width             = 12
ScrollBar.showButtons       = false
ScrollBar.trackColor        = #0F1113
ScrollBar.thumbColor        = #2A2D32
ToolBar.spacingInsets       = 4,4,4,4
MenuItem.acceleratorGap     = 24

# ── Standard component overrides for the black ramp ──────────────────
Component.borderColor       = #24272C
Component.disabledBorderColor = #1A1D20
Component.focusColor        = #4DA6FF30
Menu.background             = #0F1113
Menu.foreground             = #D4D4D4
MenuItem.background         = #0F1113
MenuItem.foreground         = #D4D4D4
MenuItem.selectionBackground = #1E2125
MenuItem.selectionForeground = #D4D4D4
PopupMenu.background        = #0F1113
PopupMenu.foreground        = #D4D4D4
Separator.foreground        = #24272C
TabbedPane.background       = #0F1113
TabbedPane.selectedBackground = #1E2125
TabbedPane.foreground       = #D4D4D4
TextField.background        = #151717
TextField.foreground        = #D4D4D4
TextArea.background         = #151717
TextArea.foreground         = #D4D4D4
TextPane.background         = #151717
EditorPane.background       = #151717
ComboBox.background         = #151717
ComboBox.foreground         = #D4D4D4
CheckBox.foreground          = #D4D4D4
RadioButton.foreground        = #D4D4D4
Label.foreground             = #D4D4D4
Label.disabledForeground     = #707378
Button.foreground            = #D4D4D4
ToolBar.background           = #0A0B0D
ToolBar.foreground           = #D4D4D4
StatusBar.background         = #0A0B0D
StatusBar.foreground         = #93969A
